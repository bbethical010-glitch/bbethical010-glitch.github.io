<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" width="720" height="1560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Oswald:wght@600;700&amp;display=swap');
      .title { font-family: 'Anton', sans-serif; font-size: 64px; fill: #dd0061; text-anchor: middle; letter-spacing: 2px; }
      .label { font-family: 'Oswald', sans-serif; font-size: 32px; fill: #e5e2e1; font-weight: 600; }
      .desc { font-family: 'Oswald', sans-serif; font-size: 22px; fill: #988ca1; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#131313"/>
  <text x="70" y="80" font-family="'Oswald', sans-serif" font-size="28" fill="#e5e2e1" font-weight="600">9:41</text>
  
  <text x="360" y="180" class="title">SETTINGS &amp; CONTROLS</text>

  <!-- Setting Item 1 -->
  <rect x="70" y="270" width="580" height="150" fill="#1c1b1b" stroke="#9b30ff" stroke-width="3"/>
  <text x="110" y="335" class="label">Haptic Feedback</text>
  <text x="110" y="375" class="desc">Vibrate device on each capsule drop</text>
  <!-- Toggle ON -->
  <rect x="520" y="320" width="90" height="50" rx="25" fill="#9b30ff"/>
  <circle cx="585" cy="345" r="20" fill="#f4c300"/>

  <!-- Setting Item 2 -->
  <rect x="70" y="460" width="580" height="150" fill="#1c1b1b" stroke="#f4c300" stroke-width="3"/>
  <text x="110" y="525" class="label">Strict Content Filter</text>
  <text x="110" y="565" class="desc">Filter explicit language and sensitive media</text>
  <!-- Toggle ON -->
  <rect x="520" y="510" width="90" height="50" rx="25" fill="#f4c300"/>
  <circle cx="585" cy="535" r="20" fill="#131313"/>

  <!-- Setting Item 3 -->
  <rect x="70" y="650" width="580" height="150" fill="#1c1b1b" stroke="#dd0061" stroke-width="3"/>
  <text x="110" y="715" class="label">Acid Glitch Visuals</text>
  <text x="110" y="755" class="desc">CRT scanlines and high-contrast color skew</text>
  <!-- Toggle OFF -->
  <rect x="520" y="700" width="90" height="50" rx="25" fill="#333"/>
  <circle cx="545" cy="725" r="20" fill="#988ca1"/>

  <!-- App Info Block -->
  <rect x="70" y="850" width="580" height="200" fill="#18181b" stroke="#333" stroke-width="2"/>
  <text x="360" y="930" font-family="'Anton', sans-serif" font-size="36" fill="#f4c300" text-anchor="middle">MEME CAPSULE v1.0.0</text>
  <text x="360" y="980" font-family="'Oswald', sans-serif" font-size="22" fill="#988ca1" text-anchor="middle">Made with pure chaos by Pratham Pandey</text>

  <rect x="260" y="1510" width="200" height="8" rx="4" fill="#988ca1" opacity="0.6"/>
</svg>
